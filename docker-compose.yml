# DAClaw with the web dashboard.
#
#   export DACLAW_UID=$(id -u) DACLAW_GID=$(id -g)
#   docker compose up -d --build
#   # put API keys in ./data/.env (created on first start), then restart:
#   docker compose restart
#   # open http://127.0.0.1:9119
#
# ./data is mounted as DACLAW_HOME (config.yaml, .env, sessions, uploads),
# so keys and user data stay on the host and never end up in the image.
# Run any other command in the same container setup with, e.g.:
#   docker compose run --rm daclaw chat -t data-agent-chat
#
# On a shared multi-user host: the dashboard hands its session token to anyone
# who can open the page, and that token can read the API keys in ./data/.env.
# Binding to 127.0.0.1 keeps it off the network but not away from other users
# logged in to the same machine. Stop the container when you are done, or use
# keys you can afford to lose there.
services:
  daclaw:
    image: ${DACLAW_IMAGE:-daclaw:local}
    build: .
    volumes:
      - ./data:/opt/data
    # Published on the host's loopback only. Inside the container the dashboard
    # must listen on 0.0.0.0 to be reachable through Docker networking, which
    # is why --insecure is passed; do not change the host side to 0.0.0.0.
    ports:
      - "127.0.0.1:9119:9119"
    environment:
      # Required: the entrypoint chowns ./data to this UID/GID, so it must be
      # your host user or you lose access to your own .env and config.yaml.
      - DACLAW_UID=${DACLAW_UID:?export DACLAW_UID to your host uid (id -u) first}
      - DACLAW_GID=${DACLAW_GID:?export DACLAW_GID to your host gid (id -g) first}
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]
    restart: unless-stopped
