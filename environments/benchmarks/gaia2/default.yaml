# GAIA2 on DAClaw harness ③ (environments/agent_loop.py DAClawAgentLoop)
#
#   cd ~/DAClaw && .venv/bin/python -m environments.benchmarks.gaia2.bench run \
#       --config environments/benchmarks/gaia2/default.yaml --name <run_name>
#
# Keys are read from ~/.daclaw/.env (only `api_key_env` below), never written out.

dataset:
  hf_repo: meta-agents-research-environments/gaia2
  hf_config: mini            # 160 scenarios, 32 each of execution/search/adaptability/time/ambiguity
  split: validation
  sample_size: 3
  sample_seed: 20261103      # random.Random(seed).sample(range(len(ds)), sample_size)
  scenario_ids: []           # non-empty -> run exactly these, ignore sampling

paths:
  bench_root: ~/gaia2_bench
  are_site: ~/gaia2_bench/are_site                       # ARE installed with --no-deps --target
  demo_fs_path: ~/gaia2_bench/gaia2_filesystem/demo_filesystem
  hf_home: ~/gaia2_bench/hf_cache
  hf_endpoint: https://hf-mirror.com
  daclaw_env_file: ~/.daclaw/.env

agent:                       # mirrors DAClawAgentEnvConfig fields used by DAClawAgentLoop
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  max_agent_turns: 80        # LLM calls per user turn; = ARE default agent max_iterations
  agent_temperature: 1.0     # ARE's LiteLLM engine sends no temperature -> provider default 1.0
  max_token_length: null     # ARE sends no max_tokens either
  extra_body: null
  text_reply_nudges: 10      # plain-text final reply -> remind to call send_message_to_user, at most
                             # this many times (= ARE invalid_format_retries default, base_agent.py:347)
  forward_text_reply: false  # true = still plain text after the reminder -> deliver that text to the
                             # user (more lenient than ARE, whose agent cannot reach the user that way)

judge:                       # ARE GraphPerEventJudge; official default is Llama-3.3-70B-Instruct
  model: deepseek/deepseek-v4-pro    # LiteLLM model string (reads DEEPSEEK_API_KEY)
  provider: local
  endpoint: https://api.deepseek.com/v1
  fix_case_bug: false        # false = ARE judge as shipped (comparable to the official setup);
                             # true = case-insensitive [[True]]/[[False]] matching in LLMChecker
                             # (ARE 1.2.0 LiteLLM/HF engines lowercase True/False). Report both.

run:
  scenario_timeout: 3600     # wall-clock seconds per scenario (official: 1860)
  turn_wait_timeout: 900     # wall seconds to wait for the next user message between turns
                             # (covers the online per-turn judge call that releases it)
