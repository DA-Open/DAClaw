name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS app and dmg
        env:
          DACLAW_DEFAULT_ARK_API_KEY: ${{ secrets.DACLAW_DEFAULT_ARK_API_KEY }}
        run: |
          chmod +x packaging/macos/build-app.sh
          packaging/macos/build-app.sh \
            --version "${{ github.event.inputs.version }}" \
            --include-volcengine-ark-defaults

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daclaw-macos-${{ github.event.inputs.version }}
          path: |
            packaging/macos/dist/*.dmg
            packaging/macos/dist/*.zip