name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  build-macos:
    # Pin to an Apple Silicon runner so the generated app uses arm64 tooling
    # and does not ask M-series Mac users to install Rosetta.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runner architecture
        run: |
          echo "Runner machine: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"

      - name: Check tool architecture
        run: |
          echo "Node arch: $(node -p 'process.arch')"
          echo "Python arch: $(python -c 'import platform; print(platform.machine())')"
          test "$(node -p 'process.arch')" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"

      - name: Build macOS app and dmg
        env:
          DACLAW_DEFAULT_ARK_API_KEY: ${{ secrets.DACLAW_DEFAULT_ARK_API_KEY }}
          DACLAW_DEFAULT_ARK_MODEL: ${{ secrets.DACLAW_DEFAULT_ARK_MODEL }}
          DACLAW_DEFAULT_ARK_ENDPOINT_ID: ${{ secrets.DACLAW_DEFAULT_ARK_ENDPOINT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x packaging/macos/build-app.sh
          packaging/macos/build-app.sh \
            --version "${{ github.event.inputs.version }}" \
            --include-volcengine-ark-defaults

      - name: Verify bundled Python runtime
        run: |
          APP="packaging/macos/build/DAClaw.app"
          file "$APP/Contents/MacOS/DAClaw"
          file "$APP/Contents/MacOS/DAClaw" | grep 'Mach-O' | grep 'arm64'
          test -x "$APP/Contents/Resources/python/bin/python3" || test -x "$APP/Contents/Resources/python/bin/python3.11"
          PY="$APP/Contents/Resources/python/bin/python3"
          if [ ! -x "$PY" ]; then PY="$APP/Contents/Resources/python/bin/python3.11"; fi
          "$PY" -c 'import platform, sys; print(sys.version); print(platform.machine()); assert platform.machine() == "arm64"'
          grep 'architecture_verification=passed' "$APP/Contents/Resources/build-architecture-report.txt"
          cat "$APP/Contents/Resources/build-architecture-report.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daclaw-macos-${{ github.event.inputs.version }}
          path: |
            packaging/macos/dist/*.dmg
            packaging/macos/dist/*.zip
